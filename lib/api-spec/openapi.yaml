openapi: 3.0.3
info:
  title: Votechain API
  version: 1.0.0
servers:
  - url: /api

paths:
  /auth/signup:
    post:
      operationId: signup
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /auth/me:
    get:
      operationId: getMe
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /organizations:
    get:
      operationId: listOrganizations
      tags: [Organizations]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
    post:
      operationId: createOrganization
      tags: [Organizations]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrgInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'

  /organizations/{slug}:
    get:
      operationId: getOrganization
      tags: [Organizations]
      security:
        - bearerAuth: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
    put:
      operationId: updateOrganization
      tags: [Organizations]
      security:
        - bearerAuth: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrgInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'

  /organizations/{slug}/join:
    post:
      operationId: joinOrganization
      tags: [Organizations]
      security:
        - bearerAuth: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgMember'

  /organizations/{slug}/members:
    get:
      operationId: listMembers
      tags: [Organizations]
      security:
        - bearerAuth: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrgMember'
    post:
      operationId: addMember
      tags: [Organizations]
      security:
        - bearerAuth: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgMember'

  /organizations/{slug}/members/{userId}:
    put:
      operationId: updateMemberRole
      tags: [Organizations]
      security:
        - bearerAuth: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: userId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRoleInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgMember'
    delete:
      operationId: removeMember
      tags: [Organizations]
      security:
        - bearerAuth: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: userId, in: path, required: true, schema: { type: integer } }
      responses:
        '204':
          description: No Content

  /organizations/{slug}/elections:
    get:
      operationId: listOrgElections
      tags: [Organizations]
      security:
        - bearerAuth: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Election'

  /organizations/{slug}/analytics:
    get:
      operationId: getOrgAnalytics
      tags: [Organizations]
      security:
        - bearerAuth: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgAnalytics'

  /elections:
    get:
      operationId: listElections
      tags: [Elections]
      security:
        - bearerAuth: []
      parameters:
        - { name: status, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Election'
    post:
      operationId: createElection
      tags: [Elections]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateElectionInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Election'

  /elections/{id}:
    get:
      operationId: getElection
      tags: [Elections]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Election'
    put:
      operationId: updateElection
      tags: [Elections]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateElectionInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Election'

  /elections/{id}/candidates:
    post:
      operationId: addCandidate
      tags: [Elections]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Candidate'

  /elections/{id}/candidates/{candidateId}:
    delete:
      operationId: removeCandidate
      tags: [Elections]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: candidateId, in: path, required: true, schema: { type: integer } }
      responses:
        '204':
          description: No Content

  /elections/{id}/publish:
    post:
      operationId: publishElection
      tags: [Elections]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Election'

  /elections/{id}/close:
    post:
      operationId: closeElection
      tags: [Elections]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Election'

  /elections/{id}/vote:
    post:
      operationId: castVote
      tags: [Elections]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoteInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoteResponse'

  /elections/{id}/my-vote:
    get:
      operationId: getMyVote
      tags: [Elections]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoteResponse'

  /elections/{id}/results:
    get:
      operationId: getResults
      tags: [Elections]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElectionResults'

  /elections/{id}/audit:
    get:
      operationId: getAuditTrail
      tags: [Elections]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditTrail'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SignupInput:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string }
        password: { type: string }
        name: { type: string }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    User:
      type: object
      required: [id, email, name, emailVerified, phoneVerified, verificationLevel, createdAt]
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        phone: { type: string }
        emailVerified: { type: boolean }
        phoneVerified: { type: boolean }
        verificationLevel: { type: integer }
        avatarUrl: { type: string }
        createdAt: { type: string }

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user:
          $ref: '#/components/schemas/User'

    Organization:
      type: object
      required: [id, name, slug, isPublic, ownerId, memberCount, electionCount, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        logoUrl: { type: string }
        isPublic: { type: boolean }
        ownerId: { type: integer }
        memberCount: { type: integer }
        electionCount: { type: integer }
        myRole: { type: string }
        createdAt: { type: string }

    CreateOrgInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        isPublic: { type: boolean }

    UpdateOrgInput:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        isPublic: { type: boolean }

    OrgMember:
      type: object
      required: [id, userId, orgId, name, email, role, joinedAt]
      properties:
        id: { type: integer }
        userId: { type: integer }
        orgId: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string }
        joinedAt: { type: string }

    AddMemberInput:
      type: object
      required: [email, role]
      properties:
        email: { type: string }
        role: { type: string }

    UpdateMemberRoleInput:
      type: object
      required: [role]
      properties:
        role: { type: string }

    Candidate:
      type: object
      required: [id, electionId, name, displayOrder]
      properties:
        id: { type: integer }
        electionId: { type: integer }
        name: { type: string }
        description: { type: string }
        imageUrl: { type: string }
        displayOrder: { type: integer }
        voteCount: { type: integer }
        percentage: { type: number }

    CandidateInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        imageUrl: { type: string }

    Election:
      type: object
      required: [id, orgId, orgName, orgSlug, title, type, status, startTime, endTime, isPublic, maxChoices, quorum, totalVotes, voterCount, candidates, createdBy, createdAt]
      properties:
        id: { type: integer }
        orgId: { type: integer }
        orgName: { type: string }
        orgSlug: { type: string }
        title: { type: string }
        description: { type: string }
        type: { type: string }
        status: { type: string }
        startTime: { type: string }
        endTime: { type: string }
        isPublic: { type: boolean }
        maxChoices: { type: integer }
        quorum: { type: integer }
        totalVotes: { type: integer }
        voterCount: { type: integer }
        electionHash: { type: string }
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/Candidate'
        createdBy: { type: integer }
        createdAt: { type: string }

    CreateElectionInput:
      type: object
      required: [orgId, title, type, startTime, endTime, candidates]
      properties:
        orgId: { type: integer }
        title: { type: string }
        description: { type: string }
        type: { type: string }
        startTime: { type: string }
        endTime: { type: string }
        isPublic: { type: boolean }
        maxChoices: { type: integer }
        quorum: { type: integer }
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/CandidateInput'

    UpdateElectionInput:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        startTime: { type: string }
        endTime: { type: string }
        isPublic: { type: boolean }

    VoteInput:
      type: object
      required: [choices]
      properties:
        choices:
          type: array
          items: { type: integer }

    VoteResponse:
      type: object
      required: [voteId, voteHash, txSignature, message]
      properties:
        voteId: { type: integer }
        voteHash: { type: string }
        txSignature: { type: string }
        message: { type: string }
        choices:
          type: array
          items: { type: integer }

    CandidateResult:
      type: object
      required: [id, name, voteCount, percentage, rank, isWinner]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        voteCount: { type: integer }
        percentage: { type: number }
        rank: { type: integer }
        isWinner: { type: boolean }

    ElectionResults:
      type: object
      required: [electionId, title, type, status, totalVotes, voterCount, turnout, candidates]
      properties:
        electionId: { type: integer }
        title: { type: string }
        type: { type: string }
        status: { type: string }
        totalVotes: { type: integer }
        voterCount: { type: integer }
        turnout: { type: number }
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/CandidateResult'
        winner:
          $ref: '#/components/schemas/CandidateResult'
        closedAt: { type: string }

    VoteAudit:
      type: object
      required: [id, voteHash, txSignature, blockHeight, createdAt]
      properties:
        id: { type: integer }
        voteHash: { type: string }
        txSignature: { type: string }
        blockHeight: { type: integer }
        createdAt: { type: string }

    AuditTrail:
      type: object
      required: [electionId, electionTitle, electionHash, totalVotes, votes, integrityVerified]
      properties:
        electionId: { type: integer }
        electionTitle: { type: string }
        electionHash: { type: string }
        totalVotes: { type: integer }
        votes:
          type: array
          items:
            $ref: '#/components/schemas/VoteAudit'
        integrityVerified: { type: boolean }

    OrgAnalytics:
      type: object
      required: [totalElections, totalVotes, totalMembers, activeElections, avgTurnout]
      properties:
        totalElections: { type: integer }
        totalVotes: { type: integer }
        totalMembers: { type: integer }
        activeElections: { type: integer }
        avgTurnout: { type: number }
